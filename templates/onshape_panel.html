<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BionicsCAM Onshape Panel</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/refresh-ui.css">
    <script>window.si = window.si || function () { (window.siq = window.siq || []).push(arguments); };</script>
    <script defer src="/_vercel/speed-insights/script.js"></script>
</head>
<body class="panel-shell">
    <div class="panel-content">
        <div class="panel-logo">
            <img src="/static/bionicslogo.png" alt="4909">
            <div class="panel-logo-text"><span>Bionics</span>CAM</div>
        </div>

        <div class="mode-selector">
            <div class="mode-title">Import mode</div>
            <div class="mode-switch-container">
                <span class="mode-label-text active" id="mode2DLabel">2D</span>
                <label class="mode-switch" aria-label="Toggle 2D or 2.5D mode">
                    <input type="checkbox" id="multilayerMode">
                    <span class="mode-slider"></span>
                </label>
                <span class="mode-label-text" id="mode25DLabel">2.5D</span>
            </div>
            <div class="mode-hint" id="modeHint">Any stock thickness works — cutting a flat pattern only.</div>
        </div>

        <div id="instruction" class="instruction">Select the top face of your part to manufacture.</div>

        <div id="multiPartGroup" class="button-group" style="display: none;">
            <button id="importAllParts" class="btn-primary">Import selected part(s)</button>
            <div class="mode-hint">Exports selected faces as separate DXFs for nesting.</div>
        </div>

        <div id="buttonGroup" class="button-group" style="display: none;">
            <button id="selectAnotherFace" class="btn-secondary">Select another face</button>
        </div>
    </div>

    <script>
        window.ONSHAPE_CONTEXT = {
            documentId: '{{ document_id }}',
            workspaceId: '{{ workspace_id }}',
            elementId: '{{ element_id }}',
            server: '{{ server }}',
            baseUrl: '{{ request.url_root.rstrip('/') }}'
        };
    </script>
    <script src="/static/onshape_panel.js"></script>
</body>
</html>
