name: CAM Integration Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test-cam:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      # uv provisions CPython 3.11 itself for the venv below; no setup-python step.
      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        # A .venv in the checkout root is what the Makefile's `uv run python`
        # picks up without a project file, so the interpreter is the same one
        # the packages land in.
        run: |
          uv venv --python 3.11
          uv pip install -r requirements.txt

      - name: Runner image identity for the Orca cache key
        id: img
        run: echo "id=${ImageOS}-${ImageVersion}" >> "$GITHUB_OUTPUT"

      - name: Cache Orca Slicer
        uses: actions/cache@v4
        with:
          path: tools/orca
          # hostlibs holds only what the image lacked at install time, so a new
          # runner image must miss the cache and reinstall.
          key: orca-${{ runner.os }}-${{ runner.arch }}-${{ steps.img.outputs.id }}-${{ hashFiles('print/scripts/install-orca.sh') }}

      - name: Install Orca Slicer
        run: print/scripts/install-orca.sh

      - name: Run all tests (unit, system, Orca slice)
        run: make test
